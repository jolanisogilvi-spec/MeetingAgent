services:
  backend:
    build:
      context: ./backend
    container_name: meetingagent-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data
      - meetingagent-model-cache:/root/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: meetingagent-frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8050}:8050"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8050/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  meetingagent-model-cache:
